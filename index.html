<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Performance Diagnostic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0C;color:#ECEDEA;font:14px/1.5 monospace;min-height:100vh}
#panel{position:fixed;top:0;left:0;right:0;z-index:10;
  background:rgba(0,0,0,.92);padding:12px 14px;border-bottom:2px solid #10CE29}
h1{font-size:14px;color:#10CE29;margin-bottom:8px}
#env{font-size:11px;color:#8a949c;margin-bottom:10px;line-height:1.7}
#env b{color:#ECEDEA}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
button{
  padding:7px 11px;font:600 11px monospace;cursor:pointer;
  background:#1a1e22;color:#10CE29;border:1px solid #10CE29;border-radius:3px;
}
button:hover{background:#10CE29;color:#0A0A0C}
button.on{background:#10CE29;color:#0A0A0C}
#read{font-size:19px;font-weight:700;color:#10CE29;padding:6px 0}
#read span{font-size:12px;color:#8a949c;font-weight:400}
#log{font-size:11px;color:#b9bec2;max-height:130px;overflow:auto;
  border-top:1px solid #2a2f35;padding-top:8px;margin-top:6px}
#log div{padding:2px 0}
#log b{color:#10CE29}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>CANVAS PERFORMANCE DIAGNOSTIC</h1>
  <div id="env"></div>
  <div class="btns">
    <button data-t="0">0 · idle loop</button>
    <button data-t="1">1 · clearRect</button>
    <button data-t="2">2 · 1 big fill</button>
    <button data-t="3">3 · 500 dots</button>
    <button data-t="4">4 · 2500 dots</button>
    <button data-t="5">5 · 2500 + math</button>
    <button data-t="6">6 · full anim</button>
    <button id="stop">■ stop</button>
  </div>
  <div id="read">— <span>pick a test</span></div>
  <div id="log"></div>
</div>
<script>
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var readEl=document.getElementById('read'), logEl=document.getElementById('log'), envEl=document.getElementById('env');

var W,H,DPR,test=-1,raf=null,dots=[];
var frames=0,last=performance.now(),t=0;
var rafGaps=[],lastRaf=0;

// ---------- environment info ----------
function envInfo(){
  var gl=null,rend='unknown';
  try{
    var tc=document.createElement('canvas');
    gl=tc.getContext('webgl')||tc.getContext('experimental-webgl');
    if(gl){
      var dbg=gl.getExtension('WEBGL_debug_renderer_info');
      if(dbg) rend=gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      else rend='WebGL ok (renderer hidden)';
    } else rend='WEBGL UNAVAILABLE — no GPU accel!';
  }catch(e){ rend='error: '+e.message; }

  envEl.innerHTML =
    'screen <b>'+screen.width+'×'+screen.height+'</b> · '+
    'window <b>'+window.innerWidth+'×'+window.innerHeight+'</b> · '+
    'devicePixelRatio <b>'+window.devicePixelRatio+'</b><br>'+
    'cores <b>'+(navigator.hardwareConcurrency||'?')+'</b> · '+
    'memory <b>'+(navigator.deviceMemory||navigator.deviceMemory===0?navigator.deviceMemory+'GB':'?')+'</b> · '+
    'protocol <b>'+location.protocol+'</b><br>'+
    'GPU <b>'+rend+'</b>';
}

function log(s){
  var d=document.createElement('div');
  d.innerHTML=s;
  logEl.insertBefore(d, logEl.firstChild);
}

function size(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function buildDots(n){
  dots=[];
  var cols=Math.ceil(Math.sqrt(n*W/H));
  var rows=Math.ceil(n/cols);
  var gx=W/cols, gy=H/rows;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    if(dots.length>=n) break;
    var hx=gx*(c+.5), hy=gy*(r+.5);
    dots.push({hx:hx,hy:hy,x:hx,y:hy,ph:hx*.05+hy*.05,px:hx*.08,py:hy*.08});
  }
}

// sine LUT for test 5/6
var LN=2048,LUT=new Float32Array(LN);
for(var i=0;i<LN;i++)LUT[i]=Math.sin(i/LN*Math.PI*2);
var LK=LN/(Math.PI*2);
function fsin(x){return LUT[((x*LK)|0)&(LN-1)]}
function fcos(x){return LUT[(((x*LK)|0)+(LN>>2))&(LN-1)]}

var COL='rgba(16,206,41,0.55)';

function frame(){
  t++; frames++;
  var now=performance.now();

  // measure raf pacing
  if(lastRaf){ rafGaps.push(now-lastRaf); if(rafGaps.length>120) rafGaps.shift(); }
  lastRaf=now;

  if(now-last>=1000){
    var fps=frames;
    var avg=0; for(var q=0;q<rafGaps.length;q++) avg+=rafGaps[q];
    avg = rafGaps.length? (avg/rafGaps.length) : 0;
    var px=(cv.width*cv.height/1e6).toFixed(1);
    readEl.innerHTML = fps+' fps <span>· test '+test+' · rAF gap '+avg.toFixed(1)+'ms · canvas '+cv.width+'×'+cv.height+' ('+px+'MP)</span>';
    frames=0; last=now;
  }

  // ---------------- TESTS ----------------
  if(test===0){
    // pure requestAnimationFrame loop, zero canvas work
  }
  else if(test===1){
    ctx.clearRect(0,0,W,H);
  }
  else if(test===2){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=COL;
    ctx.fillRect(0,0,W,H);
  }
  else if(test===3 || test===4){
    ctx.clearRect(0,0,W,H);
    var p=new Path2D();
    for(var i3=0;i3<dots.length;i3++){
      var a3=dots[i3];
      p.moveTo(a3.hx+2.5,a3.hy);
      p.arc(a3.hx,a3.hy,2.5,0,6.28318);
    }
    ctx.fillStyle=COL;
    ctx.fill(p);
  }
  else if(test===5){
    // same as 4 but with the trig/physics per dot
    ctx.clearRect(0,0,W,H);
    var p5=new Path2D();
    var tj=t*0.03, t5x=t*0.02, t5y=t*0.021;
    for(var i5=0;i5<dots.length;i5++){
      var a5=dots[i5];
      var jit=0.06+0.05*fsin(tj+a5.ph);
      var tx5=a5.hx+fsin(t5x+a5.px)*0.5;
      var ty5=a5.hy+fcos(t5y+a5.py)*0.5;
      a5.x+=(tx5-a5.x)*0.09;
      a5.y+=(ty5-a5.y)*0.09;
      var rd=2.5+jit;
      p5.moveTo(a5.x+rd,a5.y);
      p5.arc(a5.x,a5.y,rd,0,6.28318);
    }
    ctx.fillStyle=COL;
    ctx.fill(p5);
  }
  else if(test===6){
    // full thing: 10 brightness buckets, separate fills
    ctx.clearRect(0,0,W,H);
    var NB=10, mp=[];
    for(var b=0;b<NB;b++) mp.push(new Path2D());
    var tj6=t*0.03, t6x=t*0.02, t6y=t*0.021;
    for(var i6=0;i6<dots.length;i6++){
      var a6=dots[i6];
      var lit=Math.abs(fsin(tj6+a6.ph));
      var tx6=a6.hx+fsin(t6x+a6.px)*0.5;
      var ty6=a6.hy+fcos(t6y+a6.py)*0.5;
      a6.x+=(tx6-a6.x)*0.09;
      a6.y+=(ty6-a6.y)*0.09;
      var rd6=2.5+lit*1.4;
      var bi=(lit*(NB-1))|0; if(bi>NB-1)bi=NB-1;
      mp[bi].moveTo(a6.x+rd6,a6.y);
      mp[bi].arc(a6.x,a6.y,rd6,0,6.28318);
    }
    for(var b2=0;b2<NB;b2++){
      ctx.fillStyle='rgba(16,206,41,'+(0.2+b2*0.08).toFixed(2)+')';
      ctx.fill(mp[b2]);
    }
  }

  raf=requestAnimationFrame(frame);
}

function start(n){
  test=n;
  frames=0; last=performance.now(); rafGaps=[]; lastRaf=0;
  ctx.clearRect(0,0,W,H);
  if(n===3) buildDots(500);
  else if(n>=4) buildDots(2500);
  var names=['idle rAF loop','clearRect only','clearRect + full fill','500 dots','2500 dots','2500 dots + trig','full animation (10 buckets)'];
  log('▶ started <b>test '+n+'</b> — '+names[n]);
  if(!raf) raf=requestAnimationFrame(frame);
}

document.querySelectorAll('[data-t]').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('[data-t]').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
    start(parseInt(b.getAttribute('data-t'),10));
  });
});
document.getElementById('stop').addEventListener('click',function(){
  if(raf){cancelAnimationFrame(raf);raf=null}
  test=-1; ctx.clearRect(0,0,W,H);
  document.querySelectorAll('[data-t]').forEach(function(x){x.classList.remove('on')});
  readEl.innerHTML='— <span>stopped</span>';
  log('■ stopped');
});

window.addEventListener('resize',function(){size()});
size();
envInfo();
log('ready — run tests <b>0 → 6</b> in order and note the fps for each');
</script>
</body>
</html>
